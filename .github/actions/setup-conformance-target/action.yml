name: Set up pinned conformance EELS
description: Restore or provision the exact manifest-pinned EELS checkout and locked test environment.
runs:
  using: composite
  steps:
    - name: Cache conformance EELS target
      uses: actions/cache@v4
      with:
        path: ${{ env.JAUNE_T8N_TARGET }}
        key: eels-t8n-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/sources.json') }}

    # Exact-pinned EELS checkout for the ten-case Prague replay. An existing
    # checkout is accepted only when its HEAD equals the manifest commit
    # with no uncommitted changes; any other existing checkout fails
    # without being repaired, reset, or overwritten. No existing bootstrap
    # provisions this target (bootstrap_legacy.py pins a different commit,
    # bootstrap_oracle.py builds a different venv), so the logic is inline.
    - name: Provision conformance EELS target
      shell: bash
      run: |
        UV_VERSION="$(python3 -c "import json; print(json.load(open('scripts/sources.json'))['conformance_target']['uv_version'])")"
        python3 -m pip install "uv==$UV_VERSION"
        python3 - "$JAUNE_T8N_TARGET" <<'PY'
        import json, subprocess, sys
        from pathlib import Path
        dest = Path(sys.argv[1])
        pin = json.load(open('scripts/sources.json'))['conformance_target']
        def git(*args, cwd=dest):
            run = subprocess.run(['git', '-C', str(cwd), *args], capture_output=True, text=True)
            if run.returncode != 0:
                print(f"error: git {' '.join(args)} failed: {run.stderr.strip()}", file=sys.stderr)
                raise SystemExit(1)
            return run.stdout.strip()
        if dest.exists():
            head, dirty = git('rev-parse', 'HEAD'), git('status', '--porcelain')
            if head != pin['commit'] or dirty:
                print(f"error: refusing mismatching EELS checkout at {dest} (never overwritten)", file=sys.stderr)
                raise SystemExit(1)
            print(f"NO-OP — EELS checkout already at {pin['commit']}")
        else:
            subprocess.run(['git', 'clone', '--no-checkout', '--origin', 'origin', '--', pin['repo_url'], str(dest)], check=True)
            git('checkout', '--detach', pin['commit'])
        subprocess.run(['uv', 'sync', '--frozen', '--no-default-groups', '--group', 'test'], cwd=str(dest), check=True)
        PY
