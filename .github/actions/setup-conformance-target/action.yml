name: Set up registered conformance EELS
description: Provision and verify the semantic base or the exact optional CLI adapter.
inputs:
  cli-adapter:
    description: Use the registered CLI compatibility adapter in a dedicated target path.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Cache conformance EELS target
      uses: actions/cache@v4
      with:
        path: ${{ env.JAUNE_T8N_TARGET }}
        key: eels-t8n-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cli-adapter }}-${{ hashFiles('scripts/sources.json', 'scripts/reference-patches/*.patch') }}
    - name: Provision conformance EELS target
      shell: bash
      env:
        CLI_ADAPTER: ${{ inputs.cli-adapter }}
      run: |
        UV_VERSION="$(python3 -c "import json; print(json.load(open('scripts/sources.json'))['conformance_target']['uv_version'])")"
        python3 -m pip install "uv==$UV_VERSION"
        args=(--root "$JAUNE_T8N_TARGET")
        case "$CLI_ADAPTER" in
          true) args+=(--with-cli-adapter) ;;
          false) ;;
          *) echo 'error: cli-adapter must be true or false' >&2; exit 1 ;;
        esac
        python3 scripts/bootstrap_conformance.py "${args[@]}"
        (cd "$JAUNE_T8N_TARGET" && uv sync --frozen --no-default-groups --group test)
