name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref: a newer push cancels the older run instead of
# stacking a second 30-minute build on a commit that has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository intentionally follows maintained major-version action tags
# rather than commit SHAs. Review upstream release notes before changing a tag;
# keep this policy consistent across Jaune workflows.
jobs:
  portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run portable-environment unit tests
        run: python3 -m unittest discover -s scripts/tests

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      # Static checks cover library source and ambient consumer examples.
      - name: Source hygiene
        run: scripts/check-hygiene.sh
      - name: Semantic integrity
        run: scripts/check-integrity.sh
      - name: Library and example connectivity
        run: python3 scripts/check-consumer-boundary.py
      - name: Destination axiom rows and assurance manifest
        run: python3 scripts/check-assurance-manifest.py

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
      # Two gates that need only the binary lean-action just built — no corpus,
      # no venv, no network — so they cost about a second between them and are
      # the only conformance evidence this per-push badge can honestly carry.
      # Measured locally 2026-08-13: 0.51 s and 0.35 s respectively.
      - name: Transition-tool conformance (scripts/check-t8n.sh)
        run: scripts/check-t8n.sh
      - name: U256 / word / hash primitives (scripts/check-u256.sh)
        run: scripts/check-u256.sh

  external-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Only bootstrap files are checked out; Jaune source must arrive through
      # the disposable package's exact Git dependency.
      - uses: actions/checkout@v6
        with:
          path: source-metadata
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lean-toolchain
            /scripts/external-consumer.py
            /scripts/consumer/Consumer.lean
      - name: Prepare exact-revision Git consumer
        run: |
          python3 source-metadata/scripts/external-consumer.py prepare external-consumer \
            --url "https://github.com/${GITHUB_REPOSITORY}.git" --revision "$GITHUB_SHA"
          rm -rf source-metadata
      # A fresh package has no lake-manifest.json, and lean-action refuses to
      # configure without one; resolving it here is what `lake build` does
      # implicitly when a developer builds the package locally.
      - name: Resolve the exact Git dependency
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd external-consumer && lake update
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: external-consumer
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Verify installed Git identity and built consumer
        run: python3 external-consumer/verify-consumer.py verify external-consumer
