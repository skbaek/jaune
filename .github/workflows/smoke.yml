# ============================================================================
# ACTIVE — per-push smoke conformance gate (CI plan P1). Activated 2026-07-25
# in commit 8f51aec; it has run on every push and pull request to main since.
#
# What it runs: scripts/check-legacy.sh --smoke --no-build, classifying 174
# files of the frozen ethereum/tests corpus against scripts/baseline-smoke.txt.
# Observed wall time on hosted runners: ~5.5-7 min (median ~6 min).
#
# Baseline discipline: drift is reported verbatim and fails the run. Do not
# rebaseline to go green — a CHANGE line is evidence, not noise.
#
# Scope boundary, stated so no badge implies more than it checks: this gate
# covers the frozen legacy corpus only. The current-mainnet suite
# (scripts/check-mainnet.sh, 5,100 files / 34,005 cases) is a LOCAL gate and is
# not run here; see scripts/GATES.md for the full catalogue and its ownership.
# ============================================================================
name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # bootstrap_legacy.py installs execution-specs here (its default is
  # ~/execution-specs); pinned into the workspace so actions/cache can hold it.
  EELS_ROOT: ${{ github.workspace }}/.fixtures/execution-specs

jobs:
  smoke:
    runs-on: ubuntu-24.04
    # Basis: ~9 min smoke reference (dominated by one ~6.6 min vmPerformance
    # file) + Lean build + first-run provisioning, with slack. Re-measure on the
    # first real run and tighten.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Builds jaune (elaborating every #guard) and leaves the executable at
      # .lake/build/bin/jaune for check-legacy.sh --no-build.
      - uses: leanprover/lean-action@v1

      - name: Cache legacy fixture corpus
        uses: actions/cache@v4
        with:
          path: ${{ env.EELS_ROOT }}
          key: legacy-fixtures-${{ hashFiles('scripts/sources.json') }}

      # Idempotent: on a cache hit the checkout already matches the manifest and
      # this is a fast no-op; on a miss it clones execution-specs + the nested
      # ethereum/tests + LegacyTests at their pinned commits (sha-verified).
      - name: Provision legacy fixtures
        run: python3 scripts/bootstrap_legacy.py --execution-specs "$EELS_ROOT"

      # JAUNE_TIMEOUT is left at check-legacy.sh's 1800 s default: it is a hang
      # detector, not a per-file budget, and the slowest smoke file (~395 s
      # reference) has ample headroom even on a slower hosted runner.
      - name: Smoke conformance gate (check-legacy.sh --smoke)
        run: |
          JAUNE_FIXTURES="$EELS_ROOT/tests/fixtures/ethereum_tests/BlockchainTests" \
            scripts/check-legacy.sh --smoke --no-build
