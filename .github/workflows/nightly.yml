# ============================================================================
# ACTIVE — nightly heavy-conformance workflow (CI plan P2). Activated
# 2026-07-25 in commit 590e7b3; it has run daily at 07:00 UTC since.
#
# What it runs, kept OUT of the per-push loop so pushes stay minutes-scale:
#   - scripts/check-legacy.sh --full --no-build — 2,983 classifications of the
#     frozen ethereum/tests corpus against scripts/baseline-full.txt;
#   - scripts/check-legacy.sh --bls --no-build — the EEST BLS /
#     point-evaluation tier.
# It provisions both corpora first (bootstrap_legacy.py, bootstrap_eest.py,
# each cached). Observed wall time on hosted runners: ~44-45 min.
#
# Baseline discipline: if a tier surfaces drift, every CHANGE line is reported
# verbatim and the run fails. Do not rebaseline to go green.
#
# Scope boundary, stated so no badge implies more than it checks: this covers
# the frozen legacy corpus and the BLS tier. The current-mainnet suite
# (scripts/check-mainnet.sh, 5,100 files / 34,005 cases) is a LOCAL gate and is
# not run here; see scripts/GATES.md for the full catalogue and its ownership.
# ============================================================================
name: nightly

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily (low contention); adjust as desired
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # let an in-flight nightly finish

env:
  EELS_ROOT: ${{ github.workspace }}/.fixtures/execution-specs
  EEST_ROOT: ${{ github.workspace }}/.fixtures/eest

jobs:
  full-and-bls:
    runs-on: ubuntu-24.04
    # Basis: ~56 min --full + ~8 min --bls reference, slower on hosted runners,
    # plus build + provisioning. Hosted-runner job ceiling is 360 min.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: leanprover/lean-action@v1

      - name: Cache legacy fixture corpus
        uses: actions/cache@v4
        with:
          path: ${{ env.EELS_ROOT }}
          key: legacy-fixtures-${{ hashFiles('scripts/sources.json') }}
      - name: Cache EEST fixture corpus
        uses: actions/cache@v4
        with:
          path: ${{ env.EEST_ROOT }}
          key: eest-fixtures-${{ hashFiles('scripts/sources.json') }}

      - name: Provision legacy fixtures
        run: python3 scripts/bootstrap_legacy.py --execution-specs "$EELS_ROOT"
      - name: Provision EEST fixtures
        run: python3 scripts/bootstrap_eest.py --eest-root "$EEST_ROOT"

      - name: Full conformance tier (check-legacy.sh --full)
        run: |
          JAUNE_FIXTURES="$EELS_ROOT/tests/fixtures/ethereum_tests/BlockchainTests" \
            scripts/check-legacy.sh --full --no-build
      # Run bls even if --full flagged drift, so both reports always exist.
      - name: BLS / point-evaluation tier (check-legacy.sh --bls)
        if: always()
        run: |
          JAUNE_FIXTURES="$EEST_ROOT/fixtures/blockchain_tests" \
            scripts/check-legacy.sh --bls --no-build

      - name: Upload tier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: |
            scripts/report-full.txt
            scripts/report-bls.txt
          if-no-files-found: warn
